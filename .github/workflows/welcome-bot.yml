name: Welcome by hydrox-action-bot

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Auto Welcome Comment
    runs-on: ubuntu-latest
    steps:
      - name: Post welcome comment as bot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const isPR = !!context.payload.pull_request;
            const author = isPR ? context.payload.pull_request.user.login : context.payload.issue.user.login;

            // Skip if the author is the bot itself to prevent comment loops
            if (author === 'hydrox-action-bot') {
              console.log('Skipping comment from bot self.');
              return;
            }

            const issueComment = "Hello @" + author + "! Thank you for opening this issue.\n\nWe have received your feedback, and maintainers will look into it as soon as possible.\nIf you have any additional logs, screenshots, or reproduction steps, please feel free to add them here.";
            const prComment = "Hello @" + author + "! Thank you so much for contributing to EnderBridge!\n\nOur automated CI checks are currently running, and maintainers will review your pull request soon.";

            const message = isPR ? prComment : issueComment;

            if (isPR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: message
              });
            }
