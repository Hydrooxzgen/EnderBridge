name: Welcome by hydrox-action-bot

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    name: Auto Welcome Comment
    runs-on: ubuntu-latest
    steps:
      - name: 自动以 Bot 身份回复欢迎消息
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.BOT_TOKEN }}
          script: |
            const isPR = !!context.payload.pull_request;
            const author = isPR ? context.payload.pull_request.user.login : context.payload.issue.user.login;

            // 如果发起人是 Bot 本身，跳过避免循环
            if (author === 'hydrox-action-bot') {
              console.log('Skipping comment from bot self.');
              return;
            }

            const issueComment = "你好 @" + author + "！感谢提交 Issue。\n\n我们已经收到你的反馈,管理员会尽快跟进处理。\n如有更多日志或复现步骤, 请随时在此补充。";
            const prComment = "你好 @" + author + "！非常感谢为 EnderBridge 贡献代码！\n\n我们的自动化 CI 检查正在运行中，管理员 会尽快为你审查 PR。";

            const message = isPR ? prComment : issueComment;

            if (isPR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: message
              });
            }
