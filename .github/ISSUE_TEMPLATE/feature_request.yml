name: 功能建议 / Feature Request
description: 提出一个新功能或改进建议 / Suggest a new feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提出建议！请尽量描述清楚你想要什么以及为什么。
        Thanks for suggesting! Please describe what you want and why.

  - type: textarea
    id: problem
    attributes:
      label: 动机 / Motivation
      description: 你遇到了什么问题？为什么需要这个功能？/ What problem are you facing? Why do you need this?
      placeholder: |
        当我在做 X 的时候，/ When I'm doing X,
        我希望能够.../ I wish I could...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案 / Proposed Solution
      description: 你希望这个功能如何工作？/ How should this feature work?
      placeholder: |
        描述你期望的行为.../ Describe your ideal behavior...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 你尝试过哪些变通方法或替代方案？/ Any workarounds or alternatives you've tried?
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: 涉及组件 / Affected Component
      description: 这个功能涉及哪部分？/ Which part does this affect?
      multiple: true
      options:
        - 假人 Bot（Xbox 登录 / 连接 / 缓存）/ Fake Player Bot
        - 模组加载部分 / Mod Loader
        - QQ 桥接 / QQ Bridge
        - AI 对话 / AI Chat
        - 音乐播放 / Music Playback
        - 图片像素画 / Image to Pixel Art
        - Ezmatic (Litematic) 导入 / Litematic Importer
        - Web 管理界面 / Web UI
        - 安装 或 依赖 / Installation or Dependencies
        - 其他 / Other
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional Context
      description: 任何其他信息（截图、示例等）/ Any other context (screenshots, examples, etc.)
    validations:
      required: false
