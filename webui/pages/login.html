<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnderBridge Web 管理 - 登录</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('enderbridge_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));</script>
</head>
<body>
<div id="loginView" class="show">
  <div class="login-card">
    <div class="logo">⛏️</div>
    <h1 data-i18n="login.title">EnderBridge Web 管理</h1>
    <p class="sub" id="loginSub" data-i18n="login.sub">请输入用户名和密码以继续</p>
    <div id="userPassForm">
      <label for="usernameInput" data-i18n="login.username">用户名</label>
      <input id="usernameInput" type="text" data-i18n-ph="login.usernamePh" placeholder="用户名" autocomplete="username">
      <label for="passwordInput" data-i18n="login.password">密码</label>
      <input id="passwordInput" type="password" data-i18n-ph="login.passwordPh" placeholder="密码" autocomplete="current-password">
      <button id="loginBtn" type="button" data-i18n="login.submit">登 录</button>
    </div>
    <button id="guestBtn" type="button" class="guest-btn" data-i18n="login.guest">以访客身份浏览 (Guest)</button>
    <div class="login-msg" id="loginMsg"></div>
    <div class="login-hint" id="loginHint" data-i18n="login.hint">首次启动时终端会显示 admin 的随机密码。<br>访客账号 guest 无需密码,仅可查看仪表盘和 Mod 列表。</div>
    <div class="row gap-10" style="margin-top:12px;justify-content:center;">
      <button class="theme-toggle" id="themeToggle" style="justify-content:center;"><span class="theme-icon">🌙</span><span class="theme-label">深色模式</span></button>
      <button class="theme-toggle lang-toggle" style="justify-content:center;"><span class="lang-label">🌐 EN</span></button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/i18n.js"></script>
<script>
(function() {
  var role = sessionStorage.getItem(ROLE_KEY) || "";
  if (role === "guest" || (role && sessionStorage.getItem(TOKEN_KEY))) {
    location.href = "/"; return;
  }
  $("loginBtn").addEventListener("click", doLogin);
  $("guestBtn").addEventListener("click", function() {
    // 以 guest 账号直接登录(空密码)
    $("loginBtn").disabled = true;
    api("/auth", { method: "POST", body: JSON.stringify({ username: "guest", password: "" }) })
      .then(function(data) {
        $("loginBtn").disabled = false;
        if (data.ok) {
          sessionStorage.setItem(TOKEN_KEY, data.token);
          sessionStorage.setItem(ROLE_KEY, data.role);
          sessionStorage.setItem("enderbridge_user", JSON.stringify({
            username: data.username, role: data.role, permissions: data.permissions || [], system: data.system || false
          }));
          location.href = "/";
        } else {
          $("loginMsg").textContent = data.message || t("login.guestFail");
        }
      }).catch(function() {
        $("loginBtn").disabled = false;
        $("loginMsg").textContent = t("login.noConn");
      });
  });
  $("passwordInput").addEventListener("keydown", function(e) { if (e.key === "Enter") doLogin(); });
  initTheme();
  initLang();

  function doLogin() {
    var username = $("usernameInput").value.trim();
    var password = $("passwordInput").value;
    if (!username || !password) {
      $("loginMsg").textContent = t("login.needBoth");
      return;
    }
    $("loginBtn").disabled = true;
    $("loginBtn").textContent = t("login.loggingIn");
    api("/auth", { method: "POST", body: JSON.stringify({ username: username, password: password }) })
      .then(function(data) {
        $("loginBtn").disabled = false;
        $("loginBtn").textContent = t("login.submit");
        if (data.ok) {
          sessionStorage.setItem(TOKEN_KEY, data.token);
          sessionStorage.setItem(ROLE_KEY, data.role);
          sessionStorage.setItem("enderbridge_user", JSON.stringify({
            username: data.username, role: data.role, permissions: data.permissions || [], system: data.system || false
          }));
          location.href = "/";
        } else {
          $("loginMsg").textContent = data.message || t("login.fail");
        }
      }).catch(function() {
        $("loginBtn").disabled = false;
        $("loginBtn").textContent = t("login.submit");
        $("loginMsg").textContent = t("login.noConn");
      });
  }
})();
</script>
</body>
</html>
