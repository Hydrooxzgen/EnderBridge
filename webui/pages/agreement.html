<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnderBridge - 协议管理</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('enderbridge_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));</script>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <span class="logo">⛏️</span>
    <div>
      <div class="name" id="srvName">EnderBridge</div>
      <div class="ver">Web 管理</div>
    </div>
  </div>
  <div class="nav-item" data-page="dashboard"><span>📊</span><span>仪表盘</span></div>
  <div class="nav-item" data-page="permissions"><span>👥</span><span>权限管理</span></div>
  <div class="nav-item" data-page="config"><span>⚙️</span><span>功能设置</span></div>
  <div class="nav-item" data-page="agreement"><span>📋</span><span>协议管理</span></div>
  <div class="nav-item" data-page="mods"><span>🧩</span><span>Mod 管理</span></div>
  <div class="nav-item" data-page="console"><span>💻</span><span>控制台</span></div>
  <div class="nav-item" data-page="update"><span>🔄</span><span>检查更新</span></div>
  <div class="spacer"></div>
  <button class="theme-toggle" id="themeToggle"><span class="theme-icon">🌙</span><span class="theme-label">深色模式</span></button>
  <div class="guest-badge" id="guestBadge">👤 访客模式</div>
  <div class="nav-item hidden" id="adminLoginBtn"><span>🔑</span><span>管理员登录</span></div>
  <div class="logout" id="logoutBtn"><span>🚪</span><span>退出登录</span></div>
</aside>
<div class="main">
  <h2>📋 协议管理</h2>

  <!-- 协议开关 -->
  <div class="card">
    <div class="row" style="align-items:center;justify-content:space-between;">
      <div>
        <div style="font-weight:600;">协议功能</div>
        <div class="desc">新玩家加入时弹出协议窗口，未同意前无法使用命令</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="agreementEnabled">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- 协议标题 -->
  <div class="card" style="margin-top:12px;">
    <div style="font-weight:600;margin-bottom:8px;">协议标题</div>
    <input type="text" id="agreementTitle" placeholder="📋 服务器协议" style="width:100%;padding:8px 12px;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;font-size:14px;box-sizing:border-box;" />
  </div>

  <!-- 协议内容 -->
  <div class="card" style="margin-top:12px;">
    <div style="font-weight:600;margin-bottom:8px;">协议内容</div>
    <div class="desc" style="margin-bottom:8px;">支持换行。玩家加入时会在 GUI 弹窗中显示此内容。</div>
    <textarea id="agreementText" rows="10" placeholder="欢迎来到本服务器！&#10;&#10;请遵守以下规则：&#10;1. 尊重其他玩家&#10;2. 禁止作弊和破坏&#10;3. 禁止刷屏和骚扰&#10;&#10;输入 agree 同意协议后即可游戏。" style="width:100%;padding:8px 12px;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;font-size:14px;font-family:monospace;resize:vertical;box-sizing:border-box;"></textarea>
  </div>

  <!-- 保存按钮 -->
  <div style="margin-top:12px;">
    <button class="btn btn-primary" id="saveBtn">💾 保存协议配置</button>
  </div>

  <!-- 已同意玩家列表 -->
  <div class="card" style="margin-top:20px;">
    <div style="font-weight:600;margin-bottom:8px;">已同意协议的玩家</div>
    <div class="desc" style="margin-bottom:8px;">这些玩家已同意协议，可以正常使用所有命令。</div>
    <div id="agreedList" style="background:#0f172a;border:1px solid #1e293b;border-radius:6px;padding:12px;min-height:60px;max-height:300px;overflow-y:auto;font-family:monospace;font-size:13px;color:#94a3b8;">
      加载中...
    </div>
    <div style="margin-top:8px;">
      <button class="btn btn-sm" id="clearBtn" style="color:#f87171;">🗑️ 清除所有已同意记录</button>
    </div>
  </div>
</div>
<div id="toast" style="display:none;"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/agreement.js"></script>
</body>
</html>
