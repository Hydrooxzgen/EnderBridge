<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnderBridge - 仪表盘</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('enderbridge_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));</script>
</head>
<body>
<aside class="sidebar" data-auto-sidebar></aside>
<div class="main">
  <h2 data-i18n="dash.title">📊 仪表盘</h2>
  <div class="stat-grid" id="statGrid"></div>
  <div class="card card-gap" id="playersCard">
    <h3 data-i18n="dash.players">👥 在线玩家</h3>
    <div id="playersList"></div>
  </div>
  <div class="card card-gap">
    <h3 data-i18n="dash.control">🔄 服务器控制</h3>
    <div class="row gap-10">
      <button class="btn btn-danger" id="restartBtn" data-i18n="dash.restart">♻️ 一键重启服务器</button>
    </div>
    <p class="hint" data-i18n="dash.restartHint">优雅关闭后自动以相同参数重启进程;重启期间本页面将暂时无法访问,服务器恢复后自动刷新。</p>
  </div>
  <div class="card card-gap" id="releaseNotesCard" style="display:none;">
    <h3>📝 Release Notes <span id="releaseTag" class="td-dim"></span></h3>
    <div id="releaseBody" class="release-body"></div>
    <a id="releaseLink" href="#" target="_blank" class="release-link" style="display:none;">在 GitHub 上查看 →</a>
  </div>
</div>
<div id="toast"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
