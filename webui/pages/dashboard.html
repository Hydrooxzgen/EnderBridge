<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnderBridge - 仪表盘</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('enderbridge_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));</script>
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <span class="logo">⛏️</span>
    <div>
      <div class="name" id="srvName">EnderBridge</div>
      <div class="ver" id="srvVer">Web 管理</div>
    </div>
  </div>
  <div class="nav-item" data-page="dashboard"><span>📊</span><span>仪表盘</span></div>
  <div class="nav-item" data-page="permissions"><span>👥</span><span>权限管理</span></div>
  <div class="nav-item" data-page="config"><span>⚙️</span><span>功能设置</span></div>
  <div class="nav-item" data-page="mods"><span>🧩</span><span>Mod 管理</span></div>
  <div class="nav-item" data-page="console"><span>💻</span><span>控制台</span></div>
  <div class="nav-item" data-page="audit"><span>📋</span><span>审计日志</span></div>
  <div class="nav-item" data-page="update"><span>🔄</span><span>检查更新</span></div>
  <div class="nav-item" data-page="banlist"><span>🚫</span><span>封禁管理</span></div>
  <div class="spacer"></div>
  <button class="theme-toggle" id="themeToggle"><span class="theme-icon">🌙</span><span class="theme-label">深色模式</span></button>
  <div class="guest-badge" id="guestBadge">👤 访客模式</div>
  <div class="nav-item hidden" id="adminLoginBtn"><span>🔑</span><span>管理员登录</span></div>
  <div class="logout" id="logoutBtn"><span>🚪</span><span>退出登录</span></div>
</aside>
<div class="main">
  <h2>📊 仪表盘</h2>
  <!-- 攻击警报横幅 -->
  <div class="card" id="attackAlert" style="display:none;border:1px solid var(--err,#ef4444);background:rgba(239,68,68,0.05);margin-bottom:12px;">
    <div class="row" style="justify-content:space-between;align-items:center;">
      <div>
        <span style="font-size:20px;">🚨</span>
        <span style="font-weight:600;color:var(--err,#ef4444);">服务器正遭受攻击</span>
        <span class="muted" id="attackAlertInfo"></span>
      </div>
      <a href="/banlist" class="btn btn-sm btn-primary">🚫 管理封禁</a>
    </div>
  </div>
  <div class="stat-grid" id="statGrid"></div>
  <div class="card card-gap" id="playersCard">
    <h3>👥 在线玩家</h3>
    <div id="playersList"></div>
  </div>
  <div class="card card-gap">
    <h3>🔄 服务器控制</h3>
    <div class="row gap-10">
      <button class="btn btn-danger" id="restartBtn">♻️ 一键重启服务器</button>
    </div>
    <p class="hint">优雅关闭后自动以相同参数重启进程;重启期间本页面将暂时无法访问,服务器恢复后自动刷新。</p>
  </div>
  <div class="card card-gap" id="releaseNotesCard" style="display:none;">
    <h3>📝 Release Notes <span id="releaseTag" class="td-dim"></span></h3>
    <div id="releaseBody" class="release-body"></div>
    <a id="releaseLink" href="#" target="_blank" class="release-link" style="display:none;">在 GitHub 上查看 →</a>
  </div>
</div>
<div id="toast"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/dashboard.js"></script>
</body>
</html>
