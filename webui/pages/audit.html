<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnderBridge - 审计日志</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('enderbridge_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));</script>
</head>
<body>
<aside class="sidebar" data-auto-sidebar></aside>
<div class="main">
  <h2 data-i18n="audit.title">📋 审计日志</h2>
  <div class="card">
    <div style="font-weight:600;margin-bottom:8px;" data-i18n="audit.filter">筛选</div>
    <div class="row gap-10" style="align-items:stretch;flex-wrap:wrap;">
      <select id="auditTypeFilter" style="padding:8px 12px;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;font-size:14px;">
        <option value="" data-i18n="audit.allTypes">全部类型</option>
        <option value="chat" data-i18n="audit.typeChat">💬 聊天</option>
        <option value="command" data-i18n="audit.typeCommand">⚡ 命令</option>
        <option value="terminal" data-i18n="audit.typeTerminal">🖥️ 终端</option>
        <option value="connect" data-i18n="audit.typeConnect">🟢 连接</option>
        <option value="disconnect" data-i18n="audit.typeDisconnect">🔴 断开</option>
      </select>
      <input type="text" id="auditSenderFilter" data-i18n-ph="audit.senderPh" placeholder="按玩家名过滤…" style="flex:1;min-width:160px;padding:8px 12px;border:1px solid #334155;border-radius:6px;background:#0f172a;color:#e2e8f0;font-size:14px;" autocomplete="off" />
      <button class="btn btn-sm btn-primary" id="auditQueryBtn" data-i18n="audit.query">🔍 查询</button>
      <button class="btn btn-sm" id="auditAutoBtn" data-i18n="audit.autoOff">🔄 自动刷新: 关</button>
    </div>
  </div>
  <div class="card" style="margin-top:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="font-weight:600;"><span data-i18n="audit.records">日志记录</span> <span id="auditCount" class="td-dim" style="font-weight:normal;"></span></span>
      <span id="auditStatus" class="td-dim" style="font-size:12px;"></span>
    </div>
    <div id="auditLogTable" style="background:#0f172a;border:1px solid #1e293b;border-radius:6px;overflow-x:auto;max-height:600px;overflow-y:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:13px;">
        <thead>
          <tr style="border-bottom:1px solid #1e293b;color:#94a3b8;">
            <th style="padding:8px 12px;text-align:left;white-space:nowrap;" data-i18n="audit.thTime">时间</th>
            <th style="padding:8px 12px;text-align:left;white-space:nowrap;" data-i18n="audit.thType">类型</th>
            <th style="padding:8px 12px;text-align:left;white-space:nowrap;" data-i18n="audit.thSender">发送者</th>
            <th style="padding:8px 12px;text-align:left;" data-i18n="audit.thContent">内容</th>
          </tr>
        </thead>
        <tbody id="auditLogBody"></tbody>
      </table>
      <div id="auditEmpty" style="padding:24px;text-align:center;color:#64748b;display:none;" data-i18n="audit.empty">暂无日志记录</div>
    </div>
    <div style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;">
      <button class="btn btn-sm" id="auditPrevBtn" disabled data-i18n="audit.prev">⬅ 上一页</button>
      <span id="auditPageInfo" class="td-dim" style="font-size:13px;"></span>
      <button class="btn btn-sm" id="auditNextBtn" disabled data-i18n="audit.next">下一页 ➡</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/audit.js"></script>
</body>
</html>
