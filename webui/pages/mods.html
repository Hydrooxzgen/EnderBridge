<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnderBridge - Mod 管理</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('enderbridge_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));</script>
</head>
<body>
<aside class="sidebar" data-auto-sidebar></aside>
<div class="main">
  <h2 data-i18n="mods.title">🧩 Mod 管理</h2>
  <div class="card card-gap">
    <div class="row" style="justify-content:space-between;align-items:center;">
      <div style="font-weight:600" data-i18n="mods.client">客户端 Mods</div>
      <button class="btn btn-sm" id="modRefresh" data-i18n="mods.refresh">🔄 刷新</button>
    </div>
    <table class="perm-table" style="margin-top:8px">
      <thead><tr><th data-i18n="mods.thName">Mod 名称</th><th data-i18n="mods.thPath">文件路径</th><th data-i18n="mods.thStatus">状态</th><th data-i18n="mods.thOp">操作</th></tr></thead>
      <tbody id="modBodyClient"><tr><td colspan="4" class="td-faint" data-i18n="mods.loading">加载中...</td></tr></tbody>
    </table>
  </div>
  <div class="card card-gap">
    <div class="row" style="justify-content:space-between;align-items:center;">
      <div style="font-weight:600" data-i18n="mods.server">服务端 Mods</div>
      <button class="btn btn-danger btn-sm" id="modReloadAll" data-i18n="mods.reloadAll">♻️ 重载所有 Mod（含热更新）</button>
    </div>
    <div class="hint" data-i18n="mods.reloadHint">重载所有服务端 Mod，执行服务端重载期间游戏内可能产生延迟。</div>
    <table class="perm-table" style="margin-top:8px">
      <thead><tr><th data-i18n="mods.thName">Mod 名称</th><th data-i18n="mods.thPath">文件路径</th><th data-i18n="mods.thStatus">状态</th><th data-i18n="mods.thOp">操作</th></tr></thead>
      <tbody id="modBodyServer"><tr><td colspan="4" class="td-faint" data-i18n="mods.loading">加载中...</td></tr></tbody>
    </table>
  </div>
</div>
<div id="toast"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/mods.js"></script>
</body>
</html>
