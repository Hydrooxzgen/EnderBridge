<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnderBridge - Mod 管理</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('enderbridge_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));</script>
</head>
<body>
<aside class="sidebar" data-auto-sidebar></aside>
<div class="main">
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h2 data-i18n="mods.title" style="margin:0;">🧩 Mod 管理</h2>
    <button class="btn btn-sm" id="modRefresh" data-i18n="mods.refresh">🔄 刷新</button>
  </div>

  <div class="card card-gap" style="padding:14px 16px;">
    <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
      <div class="tab-split" id="modStatusTabs" style="margin:0;">
        <span class="chip-tab active" data-tab="all"><span data-i18n="mods.tabAll">全部</span> <code id="cntAll" style="font-size:11px;opacity:0.8;">(0)</code></span>
        <span class="chip-tab" data-tab="active"><span data-i18n="mods.tabActive">正常运行</span> <code id="cntActive" style="font-size:11px;opacity:0.8;">(0)</code></span>
        <span class="chip-tab" data-tab="failed"><span data-i18n="mods.tabFailed">加载失败</span> <code id="cntFailed" style="font-size:11px;opacity:0.8;">(0)</code></span>
      </div>
      <div style="position:relative;flex:1;min-width:220px;max-width:380px;">
        <input type="text" id="modSearchInput" style="width:100%;padding:7px 32px 7px 12px;border:1px solid var(--card-border);border-radius:6px;background:var(--input-bg);color:var(--text);font-size:13px;" placeholder="🔍 搜索 Mod 名称、文件路径..." data-i18n-ph="mods.searchPh" autocomplete="off" />
        <span id="modSearchClear" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--text-dim);font-size:12px;" title="清空">✖</span>
      </div>
    </div>
  </div>

  <div class="card card-gap" id="modCardClient">
    <div class="row" style="justify-content:space-between;align-items:center;">
      <div style="font-weight:600">
        <span data-i18n="mods.client">客户端 Mods</span>
        <span class="muted" style="font-size:12px;font-weight:normal;margin-left:8px;" id="modClientCount"></span>
      </div>
    </div>
    <table class="perm-table" style="margin-top:8px">
      <thead><tr><th data-i18n="mods.thName">Mod 名称</th><th data-i18n="mods.thPath">文件路径</th><th data-i18n="mods.thStatus">状态</th><th data-i18n="mods.thOp">操作</th></tr></thead>
      <tbody id="modBodyClient"><tr><td colspan="4" class="td-faint" data-i18n="mods.loading">加载中...</td></tr></tbody>
    </table>
  </div>
  <div class="card card-gap" id="modCardServer">
    <div class="row" style="justify-content:space-between;align-items:center;">
      <div style="font-weight:600">
        <span data-i18n="mods.server">服务端 Mods</span>
        <span class="muted" style="font-size:12px;font-weight:normal;margin-left:8px;" id="modServerCount"></span>
      </div>
      <button class="btn btn-danger btn-sm" id="modReloadAll" data-i18n="mods.reloadAll">♻️ 重载所有 Mod（含热更新）</button>
    </div>
    <div class="hint" data-i18n="mods.reloadHint">重载所有服务端 Mod，执行服务端重载期间游戏内可能产生延迟。</div>
    <table class="perm-table" style="margin-top:8px">
      <thead><tr><th data-i18n="mods.thName">Mod 名称</th><th data-i18n="mods.thPath">文件路径</th><th data-i18n="mods.thStatus">状态</th><th data-i18n="mods.thOp">操作</th></tr></thead>
      <tbody id="modBodyServer"><tr><td colspan="4" class="td-faint" data-i18n="mods.loading">加载中...</td></tr></tbody>
    </table>
  </div>
</div>
<div id="toast"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/mods.js"></script>
</body>
</html>
