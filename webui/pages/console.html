<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnderBridge - 控制台</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('enderbridge_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));</script>
</head>
<body>
<aside class="sidebar" data-auto-sidebar></aside>
<div class="main">
  <h2 data-i18n="console.title">💻 控制台</h2>

  <div class="card" id="consoleCmdCard">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
      <span style="font-weight:600;" data-i18n="console.sendCmd">发送命令</span>
      <span style="font-size:12px;color:var(--text-faint);" data-i18n="console.sendHint">以 <code>/</code> 开头为游戏命令，否则作为聊天消息</span>
    </div>
    <div class="row gap-10" style="align-items:stretch">
      <input type="text" id="consoleInput" data-i18n-ph="console.inputPh" placeholder="输入命令，如 /list 或 say hello" autocomplete="off" />
      <button class="btn btn-primary btn-sm" id="consoleExecBtn" data-i18n="console.exec">▶ 执行</button>
    </div>
  </div>

  <div class="card" style="margin-top:12px;">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-weight:600;" data-i18n="console.termOut">🖥 终端输出</span>
        <span id="logStatus" style="font-size:11px;color:#4ade80;" data-i18n="console.connected">● 已连接</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <select id="logLevelFilter">
          <option value="all" data-i18n="console.all">全部</option>
          <option value="debug">Debug</option>
          <option value="info" selected>Info</option>
          <option value="warning">Warning</option>
          <option value="error">Error</option>
        </select>
        <label style="font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:4px;cursor:pointer;">
          <input type="checkbox" id="logAutoScroll" checked /> <span data-i18n="console.autoScroll">自动滚动</span>
        </label>
        <button class="btn btn-sm" id="logPauseBtn" data-i18n="console.pause">⏸ 暂停</button>
        <button class="btn btn-sm" id="logClearBtn" data-i18n="console.clear">🗑️ 清空</button>
      </div>
    </div>
    <div class="log-viewer" id="logViewer"></div>
    <div style="margin-top:6px;display:flex;align-items:center;gap:8px;">
      <span id="logCount" style="font-size:11px;color:var(--text-faint);">0 条</span>
    </div>
  </div>
</div>
<div id="toast"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/console.js"></script>
</body>
</html>
