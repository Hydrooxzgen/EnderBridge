<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EnderBridge - 检查更新</title>
<link rel="stylesheet" href="/static/css/style.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('enderbridge_theme')||(window.matchMedia('(prefers-color-scheme:light)').matches?'light':'dark'));</script>
</head>
<body>
<aside class="sidebar" data-auto-sidebar></aside>
<div class="main">
  <h2 data-i18n="upd.title">🔄 检查更新</h2>

  <div class="card card-gap">
    <div class="row" style="justify-content:space-between;align-items:center;">
      <div style="font-weight:600" data-i18n="upd.curVer">🔍 当前版本</div>
      <button class="btn btn-primary btn-sm" id="updateCheckBtn" data-i18n="upd.checkBtn">🔍 检查更新</button>
    </div>
    <div class="update-ver" style="margin:8px 0">
      <span data-i18n="upd.curVerLabel">当前版本：</span><code id="updateCurVer" style="padding:2px 6px;background:var(--input-bg);border-radius:4px;color:var(--text);">...</code>
    </div>
    <div id="updateCheckResult" style="display:none;">
      <div id="updateLatestInfo"></div>
    </div>
  </div>

  <div class="card card-gap" id="updateLocalCard">
    <div style="font-weight:600;margin-bottom:8px;" data-i18n="upd.localTitle">📦 本地文件更新</div>
    <p class="desc" data-i18n="upd.localDesc">从本地选择 EnderBridge 压缩包进行更新（zip / tar.gz / 7z / xz）。<br>
      服务器会先校验文件名与版本号，通过后自动备份并替换项目文件，然后重启。</p>
    <div class="row gap-10" style="flex-wrap:wrap;align-items:center">
      <button class="btn btn-sm" id="updateChooseFileBtn" data-i18n="upd.chooseFile">📂 选择压缩包</button>
      <input type="file" id="updateFileInput" accept=".zip,.tar.gz,.tgz,.7z,.xz" style="display:none" />
      <span id="updateFileName" class="muted" style="flex:1" data-i18n="upd.noFile">未选择文件</span>
      <button class="btn btn-primary btn-sm" id="updateLocalBtn" disabled data-i18n="upd.doUpdate">🚀 执行更新</button>
    </div>
  </div>

  <div class="card card-gap" id="updateBackupsCard">
    <div style="font-weight:600;margin-bottom:8px;" data-i18n="upd.backupTitle">⏪ 历史备份 / 回滚</div>
    <p class="desc" data-i18n="upd.backupDesc">每次执行更新前会自动备份当前版本（最多保留 3 份）。如更新出现问题，可在此一键回滚。</p>
    <button class="btn btn-sm" id="backupsLoadBtn" data-i18n="upd.backupLoad">🔄 加载备份列表</button>
    <div id="backupsList" style="margin-top:8px;"></div>
  </div>

  <div class="card card-gap">
    <div style="font-weight:600;margin-bottom:8px;" data-i18n="upd.allVersions">📜 所有版本 (GitHub Releases)</div>
    <button class="btn btn-sm" id="releasesLoadBtn" style="margin-bottom:8px" data-i18n="upd.loadHistory">加载版本历史</button>
    <div id="releasesPager" style="display:none;margin-bottom:8px">
      <span class="muted" style="margin:0 8px"><span data-i18n="upd.pagePrefix">第 </span><span id="releasesPageNum">1</span><span data-i18n="upd.pageSuffix"> 页</span></span>
      <button class="btn btn-sm" id="releasesPrevBtn" disabled data-i18n="upd.prevPage">← 上一页</button>
      <button class="btn btn-sm" id="releasesNextBtn" data-i18n="upd.nextPage">下一页 →</button>
    </div>
    <div id="releasesList"></div>
  </div>
</div>
<div id="toast"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/update.js"></script>
</body>
</html>
